          package com.palweathers;

          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;

          /** Weather Radar: right-click it to see current weather, climate, cloud wall and tornado distance/direction. */
          public class RadarBlock extends Block {
              public RadarBlock(BlockBehaviour.Properties properties) {
                  super(properties);
              }

              @Override
              protected InteractionResult useWithoutItem(BlockState state, Level level, BlockPos pos, Player player, BlockHitResult hit) {
                  if (level instanceof ServerLevel serverLevel && player instanceof ServerPlayer serverPlayer) {
                      boolean on = WeatherManager.INSTANCE.toggleRadar(serverLevel, pos);
                      serverPlayer.sendSystemMessage(Component.literal(on
                              ? "Radar screen ON for 2 minutes. Look at the dots above the block. Right-click again to switch it off."
                              : "Radar screen OFF."));
                      for (String line : WeatherManager.INSTANCE.radarReport(pos.getX() + 0.5, pos.getZ() + 0.5)) {
                          serverPlayer.sendSystemMessage(Component.literal(line));
                      }
                      if (on) {
                          for (String line : WeatherManager.INSTANCE.radarLegend()) {
                              serverPlayer.sendSystemMessage(Component.literal(line));
                          }
                      }
                  }
                  return InteractionResult.SUCCESS;
              }
          }
