          package com.palweathers;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          import com.mojang.brigadier.CommandDispatcher;
          import com.mojang.brigadier.arguments.BoolArgumentType;
          import com.mojang.brigadier.arguments.StringArgumentType;

          import net.minecraft.commands.CommandSourceStack;
          import net.minecraft.commands.Commands;
          import net.minecraft.commands.SharedSuggestionProvider;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;

          /**
           * /wx set <type>          - start a weather type now (clear, rain, storm, flood, cloud_wall, hail, tornado, hurricane, snowstorm, ice)
           * /wx climate <mode>      - mild | hot | cold | auto
           * /wx auto <true|false>   - false = the current weather never ends by itself
           * /wx status              - show what is happening
           *
           * NOTE: no permission check is added here (permission API changed between Minecraft versions).
           * On a public server add .requires(...) to the "wx" literal.
           */
          public final class WeatherCommands {
              private WeatherCommands() {
              }

              public static void register(CommandDispatcher<CommandSourceStack> dispatcher) {
                  dispatcher.register(Commands.literal("wx")
                          .then(Commands.literal("set")
                                  .then(Commands.argument("type", StringArgumentType.word())
                                          .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(typeIds(), builder))
                                          .executes(ctx -> setWeather(ctx.getSource(), StringArgumentType.getString(ctx, "type")))))
                          .then(Commands.literal("climate")
                                  .then(Commands.argument("mode", StringArgumentType.word())
                                          .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(List.of("mild", "hot", "cold", "auto"), builder))
                                          .executes(ctx -> setClimate(ctx.getSource(), StringArgumentType.getString(ctx, "mode")))))
                          .then(Commands.literal("auto")
                                  .then(Commands.argument("on", BoolArgumentType.bool())
                                          .executes(ctx -> setAuto(ctx.getSource(), BoolArgumentType.getBool(ctx, "on")))))
                          .then(Commands.literal("status")
                                  .executes(ctx -> status(ctx.getSource()))));
              }

              private static List<String> typeIds() {
                  List<String> ids = new ArrayList<>();
                  for (WeatherManager.Type t : WeatherManager.Type.values()) {
                      ids.add(t.id());
                  }
                  return ids;
              }

              private static int setWeather(CommandSourceStack source, String id) {
                  WeatherManager.Type type = WeatherManager.Type.byId(id);
                  if (type == null) {
                      source.sendFailure(Component.literal("Unknown weather: " + id));
                      return 0;
                  }
                  ServerLevel overworld = source.getServer().overworld();
                  if (!WeatherManager.INSTANCE.forceWeather(overworld, type)) {
                      source.sendFailure(Component.literal("Nobody is online in the overworld."));
                      return 0;
                  }
                  source.sendSuccess(() -> Component.literal("Weather: " + type.label), true);
                  return 1;
              }

              private static int setClimate(CommandSourceStack source, String mode) {
                  String m = mode.toLowerCase(Locale.ROOT);
                  switch (m) {
                      case "auto" -> WeatherManager.INSTANCE.setClimate(null);
                      case "mild" -> WeatherManager.INSTANCE.setClimate(WeatherManager.Climate.MILD);
                      case "hot" -> WeatherManager.INSTANCE.setClimate(WeatherManager.Climate.HOT);
                      case "cold" -> WeatherManager.INSTANCE.setClimate(WeatherManager.Climate.COLD);
                      default -> {
                          source.sendFailure(Component.literal("Use: mild, hot, cold or auto"));
                          return 0;
                      }
                  }
                  source.sendSuccess(() -> Component.literal("Climate: " + m), true);
                  return 1;
              }

              private static int setAuto(CommandSourceStack source, boolean on) {
                  WeatherManager.INSTANCE.setAuto(on);
                  source.sendSuccess(() -> Component.literal(on ? "Weather changes by itself again." : "Weather is locked (never ends by itself)."), true);
                  return 1;
              }

              private static int status(CommandSourceStack source) {
                  for (String line : WeatherManager.INSTANCE.radarReport(source.getPosition().x, source.getPosition().z)) {
                      source.sendSuccess(() -> Component.literal(line), false);
                  }
                  return 1;
              }
          }
