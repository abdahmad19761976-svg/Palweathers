      - name: Get the NeoForge template
        run: |
          set -e
          for name in MDK-26.3-ModDevGradle MDK-26.2-ModDevGradle; do
            if git clone --depth 1 "https://github.com/NeoForgeMDKs/$name.git" mdk; then
              echo "Using template $name"
              break
            fi
          done
          test -d mdk
          rm -rf mdk/.git mdk/src/main/java mdk/src/main/templates mdk/src/generated
          find mdk/src -type d -name examplemod -prune -exec rm -rf {} +
          find mdk/src -name neoforge.mods.toml -delete
          cp -r modsrc/src/main mdk/src/
          cd mdk
          sed -i -E 's/^mod_id *=.*/mod_id=palweathers/' gradle.properties
          sed -i -E 's/^mod_name *=.*/mod_name=Palweathers/' gradle.properties
          sed -i -E 's/^mod_version *=.*/mod_version=1.0.0/' gradle.properties
          sed -i -E 's/^mod_group_id *=.*/mod_group_id=com.palweathers/' gradle.properties
          sed -i -E 's/^mod_authors *=.*/mod_authors=Palweathers/' gradle.properties
          sed -i -E 's/^minecraft_version *=.*/minecraft_version=26.3/' gradle.properties
          sed -i -E "s/(id ['\"]net\.neoforged\.moddev['\"] version ['\"])[^'\"]+/\12.0.147/" build.gradle
          echo "---- gradle.properties ----"
          cat gradle.properties
          echo "---- build.gradle plugins ----"
          grep -n "moddev" build.gradle || true

      - name: Build the jar
        working-directory: mdk
        run: |
          chmod +x gradlew
          ok=0
          for v in 26.3.0.7-beta 26.3.0.6-beta; do
            echo "=== Trying NeoForge $v ==="
            sed -i -E "s/^neo_version *=.*/neo_version=$v/" gradle.properties
            if ./gradlew build --no-daemon --stacktrace; then
              ok=1
              break
            fi
          done
          test "$ok" = 1
          ls -la build/libs

      - name: Save the jar so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: palweathers-jar
          path: mdk/build/libs/*.jar
