name: Build Palweathers jar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Write the mod files
        run: |
          mkdir -p modsrc
          cd modsrc
          mkdir -p src/main/java/com/palweathers
          cat > src/main/java/com/palweathers/WeatherMod.java <<'PALWEATHERS_EOF'
          package com.palweathers;

          import com.mojang.logging.LogUtils;
          import org.slf4j.Logger;

          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.level.block.SoundType;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.common.NeoForge;
          import net.neoforged.neoforge.event.BuildCreativeModeTabContentsEvent;
          import net.neoforged.neoforge.event.RegisterCommandsEvent;
          import net.neoforged.neoforge.event.entity.EntityJoinLevelEvent;
          import net.neoforged.neoforge.event.server.ServerStartingEvent;
          import net.neoforged.neoforge.event.server.ServerStoppingEvent;
          import net.neoforged.neoforge.event.tick.ServerTickEvent;
          import net.neoforged.neoforge.registries.DeferredBlock;
          import net.neoforged.neoforge.registries.DeferredItem;
          import net.neoforged.neoforge.registries.DeferredRegister;

          @Mod(WeatherMod.MOD_ID)
          public class WeatherMod {
              public static final String MOD_ID = "palweathers";
              public static final Logger LOGGER = LogUtils.getLogger();

              public static final DeferredRegister.Blocks BLOCKS = DeferredRegister.createBlocks(MOD_ID);
              public static final DeferredRegister.Items ITEMS = DeferredRegister.createItems(MOD_ID);

              public static final DeferredBlock<RadarBlock> RADAR_BLOCK = BLOCKS.registerBlock(
                      "weather_radar",
                      RadarBlock::new,
                      props -> props.strength(3.0F).sound(SoundType.METAL));

              public static final DeferredItem<BlockItem> RADAR_ITEM =
                      ITEMS.registerSimpleBlockItem("weather_radar", RADAR_BLOCK);

              /** If the weather code ever throws, it is switched off so the server does not crash every tick. */
              private boolean weatherFailed = false;

              public WeatherMod(IEventBus modEventBus) {
                  BLOCKS.register(modEventBus);
                  ITEMS.register(modEventBus);
                  modEventBus.addListener(this::addCreative);

                  NeoForge.EVENT_BUS.addListener(this::onServerTick);
                  NeoForge.EVENT_BUS.addListener(this::onRegisterCommands);
                  NeoForge.EVENT_BUS.addListener(this::onServerStarting);
                  NeoForge.EVENT_BUS.addListener(this::onServerStopping);
                  NeoForge.EVENT_BUS.addListener(this::onEntityJoin);
              }

              private void addCreative(BuildCreativeModeTabContentsEvent event) {
                  if (event.getTabKey() == CreativeModeTabs.FUNCTIONAL_BLOCKS) {
                      event.accept(RADAR_ITEM);
                  }
              }

              private void onServerTick(ServerTickEvent.Post event) {
                  if (weatherFailed) {
                      return;
                  }
                  try {
                      ServerLevel overworld = event.getServer().overworld();
                      if (overworld != null) {
                          WeatherManager.INSTANCE.tick(overworld);
                      }
                  } catch (RuntimeException e) {
                      weatherFailed = true;
                      LOGGER.error("WeatherMod crashed and has been switched off until restart", e);
                  }
              }

              /** Cloud cubes and hailstones from an old session (for example after a crash) are removed when they load. */
              private void onEntityJoin(EntityJoinLevelEvent event) {
                  if (event.getLevel() instanceof ServerLevel && CloudField.INSTANCE.isStale(event.getEntity().getTags())) {
                      event.setCanceled(true);
                  }
              }

              private void onRegisterCommands(RegisterCommandsEvent event) {
                  WeatherCommands.register(event.getDispatcher());
              }

              private void onServerStarting(ServerStartingEvent event) {
                  WeatherManager.INSTANCE.reset();
                  weatherFailed = false;
              }

              /** Put flood water / snow / ice back before the world is saved. */
              private void onServerStopping(ServerStoppingEvent event) {
                  ServerLevel overworld = event.getServer().overworld();
                  if (overworld != null) {
                      WeatherManager.INSTANCE.restoreAll(overworld);
                  }
              }
          }
          PALWEATHERS_EOF
          mkdir -p src/main/java/com/palweathers
          cat > src/main/java/com/palweathers/WeatherManager.java <<'PALWEATHERS_EOF'
          package com.palweathers;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.core.particles.SimpleParticleType;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.util.Mth;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;
          import net.minecraft.world.level.levelgen.Heightmap;
          import net.minecraft.world.phys.AABB;

          /**
           * The whole weather system. Works in the Overworld only, on the server.
           *
           * Climate decides what can happen:
           *   MILD: nice weather -> rain -> (flood)
           *   HOT : steam rises from water -> storm -> cloud wall -> hail -> tornado (EF scale), hurricane, flood
           *   COLD: snow storm (snow piles up) -> ice -> sun comes out and everything melts
           */
          public final class WeatherManager {
              public static final WeatherManager INSTANCE = new WeatherManager();

              public enum Type {
                  CLEAR("Nice weather"),
                  RAIN("Rain"),
                  STORM("Thunderstorm"),
                  FLOOD("Flood"),
                  CLOUD_WALL("Cloud wall"),
                  HAIL("Hail"),
                  TORNADO("Tornado"),
                  HURRICANE("Hurricane"),
                  SNOWSTORM("Snow storm"),
                  ICE("Freezing / ice"),
                  THAW("Sun and melting");

                  public final String label;

                  Type(String label) {
                      this.label = label;
                  }

                  public String id() {
                      return name().toLowerCase(Locale.ROOT);
                  }

                  public static Type byId(String id) {
                      String wanted = id.toLowerCase(Locale.ROOT);
                      for (Type t : values()) {
                          if (t.id().equals(wanted)) {
                              return t;
                          }
                      }
                      return null;
                  }
              }

              public enum Climate {
                  MILD, HOT, COLD
              }

              // ------------------------------------------------------------------ tuning
              public static final float HAIL_DAMAGE = 3.0F;           // damage of one hailstone hit
              private static final int HAIL_AIM_CHANCE = 4;           // every second an exposed player has 1/4 chance to be aimed at
              private static final int HAIL_FALL_TICKS = 14;
              private static final int HAIL_MAX_IN_FLIGHT = 120;
              private static final double WALL_SPEED = 0.25;          // blocks per tick
              private static final double WALL_HALF_WIDTH = 45.0;
              private static final double WALL_HAIL_DISTANCE = 22.0;  // hail starts when the wall is this close
              private static final double HAIL_DEPTH = 250.0;         // hail zone behind the wall
              private static final double TORNADO_SPEED = 0.22;       // blocks per tick (players sprint faster)
              private static final int TORNADO_FORM_TICKS = 200;      // the funnel needs 10 seconds to touch the ground
              public static final int MIN_WIND = 45;
              public static final int MAX_WIND = 400;                 // mph
              public static final int MIN_WIDTH = 20;
              public static final int MAX_WIDTH = 1000;               // blocks
              private static final int FLOOD_COLUMNS = 200;           // columns filled every 10 ticks
              private static final double FLOOD_RISE_PER_TICK = 0.1 / 20.0; // water rises 0.1 block every second
              private static final int FLOOD_MAX_RISE = 14;
              private static final int SNOW_MAX_LAYERS = 6;
              private static final int RADAR_SIZE = 10;               // radar cells on each side of the block
              private static final double RADAR_CELL = 16.0;          // blocks in the world per radar cell
              private static final double RADAR_SPACING = 0.45;       // blocks between radar dots in the air
              private static final long RADAR_ON_TICKS = 20L * 120L;  // radar screen stays on for 2 minutes

              // radar colors: 1 green, 2 yellow, 3 orange, 4 red, 5 purple, 6 blue, 7 white
              private static final SimpleParticleType[] RADAR_PARTICLES = {
                      ParticleTypes.POOF,
                      ParticleTypes.HAPPY_VILLAGER,
                      ParticleTypes.WAX_ON,
                      ParticleTypes.FLAME,
                      ParticleTypes.CRIMSON_SPORE,
                      ParticleTypes.WITCH,
                      ParticleTypes.SOUL_FIRE_FLAME,
                      ParticleTypes.END_ROD
              };

              // ------------------------------------------------------------------ state
              private final RandomSource random = RandomSource.create();

              private Type type = Type.CLEAR;
              private Climate climate = Climate.MILD;
              private boolean climateLocked = false;
              private boolean auto = true;
              private int ticksLeft = 20 * 120;
              private int phaseTicks = 0;
              private int lightningTimer = 60;

              // rain / storm / snow cell (used by the radar)
              private double cellX, cellZ;

              // cloud wall
              private boolean wallActive = false;
              private double wallX, wallZ, wallDirX, wallDirZ;

              // tornado
              private boolean tornadoActive = false;
              private double torX, torZ, torDirX, torDirZ;
              private int torWind = 100;
              private int torWidth = 120;
              private int torAge = 0;
              private boolean torFire = false;
              private int pendingWind = -1;
              private int pendingWidth = -1;

              // hurricane
              private double hurX, hurZ, hurDirX, hurDirZ;

              // flood
              private double floodCX, floodCZ, floodRadius, floodLevel;
              private int floodBaseY;

              // hailstones that are falling right now
              private static final class Hail {
                  final int id;
                  final double x;
                  final double z;
                  final int y;
                  int age = 0;

                  Hail(int id, double x, int y, double z) {
                      this.id = id;
                      this.x = x;
                      this.y = y;
                      this.z = z;
                  }
              }

              private final ArrayList<Hail> hailstones = new ArrayList<>();
              private int hailCounter = 0;

              // radar blocks that are switched on: block position -> game time when they switch off
              private final HashMap<Long, Long> radars = new HashMap<>();

              // everything we changed in the world, so we can put it back
              private final ArrayDeque<Long> floodBlocks = new ArrayDeque<>();
              private final ArrayDeque<Long> snowBlocks = new ArrayDeque<>();
              private final HashSet<Long> snowSet = new HashSet<>();
              private final ArrayDeque<Long> iceBlocks = new ArrayDeque<>();

              private WeatherManager() {
              }

              // ------------------------------------------------------------------ public api
              public boolean forceWeather(ServerLevel level, Type t) {
                  List<ServerPlayer> players = level.players();
                  if (players.isEmpty()) {
                      return false;
                  }
                  pendingWind = -1;
                  pendingWidth = -1;
                  begin(level, players, t);
                  return true;
              }

              /** Start a tornado with your own wind speed (mph) and width (blocks). */
              public boolean forceTornado(ServerLevel level, int wind, int width) {
                  List<ServerPlayer> players = level.players();
                  if (players.isEmpty()) {
                      return false;
                  }
                  pendingWind = Mth.clamp(wind, MIN_WIND, MAX_WIND);
                  pendingWidth = Mth.clamp(width, MIN_WIDTH, MAX_WIDTH);
                  begin(level, players, Type.TORNADO);
                  return true;
              }

              /** null = automatic climate */
              public void setClimate(Climate c) {
                  if (c == null) {
                      climateLocked = false;
                  } else {
                      climate = c;
                      climateLocked = true;
                  }
              }

              public void setAuto(boolean on) {
                  auto = on;
              }

              public void reset() {
                  CloudField.INSTANCE.reset();
                  type = Type.CLEAR;
                  climate = Climate.MILD;
                  climateLocked = false;
                  auto = true;
                  ticksLeft = 20 * 120;
                  phaseTicks = 0;
                  wallActive = false;
                  tornadoActive = false;
                  torFire = false;
                  pendingWind = -1;
                  pendingWidth = -1;
                  hailstones.clear();
                  radars.clear();
                  floodBlocks.clear();
                  snowBlocks.clear();
                  snowSet.clear();
                  iceBlocks.clear();
              }

              /** Immediately remove flood water, snow, ice and hailstones we placed (used when the server stops). */
              public void restoreAll(ServerLevel level) {
                  drain(floodBlocks, level, Integer.MAX_VALUE, Blocks.WATER, Blocks.AIR.defaultBlockState());
                  drain(snowBlocks, level, Integer.MAX_VALUE, Blocks.SNOW, Blocks.AIR.defaultBlockState());
                  drain(iceBlocks, level, Integer.MAX_VALUE, Blocks.ICE, Blocks.WATER.defaultBlockState());
                  snowSet.clear();
                  hailstones.clear();
                  runCommand(level, "kill @e[type=minecraft:block_display,tag=palhail]");
                  CloudField.INSTANCE.killAll(level);
              }

              /** Switch a radar block's screen on or off. Returns true when it is now on. */
              public boolean toggleRadar(ServerLevel level, BlockPos pos) {
                  long key = pos.asLong();
                  if (radars.containsKey(key)) {
                      radars.remove(key);
                      return false;
                  }
                  radars.put(key, level.getGameTime() + RADAR_ON_TICKS);
                  return true;
              }

              // ------------------------------------------------------------------ main tick
              public void tick(ServerLevel level) {
                  // put the world back after the weather that changed it is over
                  if (type != Type.FLOOD) {
                      drain(floodBlocks, level, 300, Blocks.WATER, Blocks.AIR.defaultBlockState());
                  }
                  if (type == Type.THAW) {
                      meltSnow(level, 30);                                                // the sun melts the snow layer by layer
                      drain(iceBlocks, level, 8, Blocks.ICE, Blocks.WATER.defaultBlockState());
                  } else if (type != Type.SNOWSTORM && type != Type.ICE) {
                      drain(snowBlocks, level, 300, Blocks.SNOW, Blocks.AIR.defaultBlockState());
                      drain(iceBlocks, level, 100, Blocks.ICE, Blocks.WATER.defaultBlockState());
                  }
                  if (snowBlocks.isEmpty()) {
                      snowSet.clear();
                  }

                  List<ServerPlayer> players = level.players();
                  long time = level.getGameTime();
                  tickHailstones(level, players);
                  CloudField.INSTANCE.tick(level, players, cloudMood(), time);
                  if (players.isEmpty()) {
                      return;
                  }
                  tickRadars(level, time);
                  phaseTicks++;

                  if (auto) {
                      ticksLeft--;
                      if (ticksLeft <= 0) {
                          nextPhase(level, players);
                      }
                  }

                  switch (type) {
                      case CLEAR -> {
                          if (climate == Climate.HOT) {
                              steam(level, players, time);
                          }
                      }
                      case RAIN -> {
                          for (ServerPlayer p : players) {
                              rain(level, p, time, 12);
                              cloudDeck(level, p, time, 2);
                          }
                      }
                      case STORM -> {
                          for (ServerPlayer p : players) {
                              rain(level, p, time, 25);
                              cloudDeck(level, p, time, 7);
                          }
                          lightning(level, players, 60, 140);
                      }
                      case CLOUD_WALL -> tickWall(level, players, time, true);
                      case HAIL -> {
                          tickWall(level, players, time, false);
                          tickHail(level, players, time);
                          for (ServerPlayer p : players) {
                              cloudDeck(level, p, time, 8);
                          }
                      }
                      case TORNADO -> {
                          tickTornado(level, players, time);
                          for (ServerPlayer p : players) {
                              rain(level, p, time, 15);
                              cloudDeck(level, p, time, 8);
                          }
                      }
                      case HURRICANE -> tickHurricane(level, players, time);
                      case FLOOD -> tickFlood(level, players, time);
                      case SNOWSTORM -> tickSnowstorm(level, players, time);
                      case ICE -> tickIce(level, players, time);
                      case THAW -> {
                      }
                  }
              }

              // ------------------------------------------------------------------ phases
              private void nextPhase(ServerLevel level, List<ServerPlayer> players) {
                  switch (type) {
                      case CLEAR -> {
                          Climate old = climate;
                          if (!climateLocked) {
                              int r = random.nextInt(10);
                              climate = r < 4 ? Climate.MILD : (r < 7 ? Climate.HOT : Climate.COLD);
                          }
                          if (old != climate) {
                              broadcast(players, "The climate is now " + climate.name().toLowerCase(Locale.ROOT) + ".");
                          }
                          switch (climate) {
                              case MILD -> begin(level, players, Type.RAIN);
                              case HOT -> {
                                  int r = random.nextInt(100);
                                  if (r < 45) {
                                      begin(level, players, Type.STORM);
                                  } else if (r < 75) {
                                      begin(level, players, Type.CLOUD_WALL);
                                  } else {
                                      begin(level, players, Type.HURRICANE);
                                  }
                              }
                              case COLD -> begin(level, players, Type.SNOWSTORM);
                          }
                      }
                      case RAIN -> begin(level, players, random.nextBoolean() ? Type.FLOOD : Type.CLEAR);
                      case STORM -> {
                          int r = random.nextInt(10);
                          begin(level, players, r < 5 ? Type.CLOUD_WALL : (r < 7 ? Type.FLOOD : Type.CLEAR));
                      }
                      case CLOUD_WALL -> begin(level, players, Type.HAIL);
                      case HAIL -> begin(level, players, random.nextInt(10) < 7 ? Type.TORNADO : Type.CLEAR);
                      case HURRICANE -> begin(level, players, random.nextInt(10) < 6 ? Type.FLOOD : Type.CLEAR);
                      case TORNADO -> begin(level, players, random.nextInt(10) < 2 ? Type.FLOOD : Type.CLEAR);
                      case SNOWSTORM -> begin(level, players, Type.ICE);
                      case ICE -> begin(level, players, Type.THAW);
                      case FLOOD, THAW -> begin(level, players, Type.CLEAR);
                  }
              }

              private void begin(ServerLevel level, List<ServerPlayer> players, Type t) {
                  startPhase(level, players, t, defaultTicks(t));
              }

              private int defaultTicks(Type t) {
                  return switch (t) {
                      case CLEAR -> seconds(120, 240);
                      case RAIN -> seconds(80, 140);
                      case STORM -> seconds(90, 150);
                      case FLOOD -> seconds(240, 300);
                      case CLOUD_WALL -> seconds(150, 180);
                      case HAIL -> seconds(70, 90);
                      case TORNADO -> seconds(120, 160);
                      case HURRICANE -> seconds(180, 240);
                      case SNOWSTORM -> seconds(120, 180);
                      case ICE -> seconds(60, 90);
                      case THAW -> seconds(70, 100);
                  };
              }

              /** 0 = white clouds, 1 = grey clouds, 2 = dark storm clouds. */
              private int cloudMood() {
                  return switch (type) {
                      case CLEAR, THAW, ICE -> 0;
                      case RAIN, SNOWSTORM -> 1;
                      default -> 2;
                  };
              }

              private int seconds(int min, int max) {
                  return (min + random.nextInt(max - min + 1)) * 20;
              }

              private void startPhase(ServerLevel level, List<ServerPlayer> players, Type t, int ticks) {
                  type = t;
                  ticksLeft = ticks;
                  phaseTicks = 0;
                  lightningTimer = 40;
                  pickCell(players);
                  if (t != Type.CLOUD_WALL && t != Type.HAIL) {
                      wallActive = false;
                  }
                  if (t != Type.TORNADO) {
                      tornadoActive = false;
                      torFire = false;
                  }

                  String message;
                  switch (t) {
                      case CLOUD_WALL -> {
                          String from = startWall(players, 110);
                          message = "A huge dark cloud wall is coming from the " + from + "! Hail and maybe a tornado follow behind it.";
                      }
                      case HAIL -> {
                          if (!wallActive) {
                              startWall(players, 15);
                          }
                          message = "HAIL! Get under a roof - a hailstone does " + (int) HAIL_DAMAGE + " damage.";
                      }
                      case TORNADO -> {
                          String from = startTornado(players);
                          message = "A funnel cloud is dropping from the clouds to the " + from + "! A tornado is forming - run or hide!";
                      }
                      case HURRICANE -> {
                          String from = startHurricane(players);
                          message = "A hurricane is coming from the " + from + "! Strong wind, rain and lightning. The eye is calm.";
                      }
                      case FLOOD -> {
                          startFlood(players);
                          message = "Heavy rain is flooding the land! The water keeps rising - go to high ground.";
                      }
                      case STORM -> message = "A thunderstorm is rolling in. The air is hot and the clouds grow dark.";
                      case RAIN -> message = "It starts to rain.";
                      case SNOWSTORM -> message = "A snow storm is coming. The snow piles up.";
                      case ICE -> message = "The snow stops, but everything is freezing. Water turns to ice.";
                      case THAW -> message = "The sun comes out and gets hot. Snow and ice are melting.";
                      default -> message = "The sky clears up. Nice weather.";
                  }

                  applyVanillaWeather(level, t, ticks);
                  broadcast(players, message);
              }

              private void pickCell(List<ServerPlayer> players) {
                  ServerPlayer p = players.get(random.nextInt(players.size()));
                  cellX = p.getX() + (random.nextDouble() - 0.5) * 80.0;
                  cellZ = p.getZ() + (random.nextDouble() - 0.5) * 80.0;
              }

              /** Uses the normal /weather command so the visuals (rain, thunder) are vanilla. */
              private void applyVanillaWeather(ServerLevel level, Type t, int ticks) {
                  String command = switch (t) {
                      case RAIN, FLOOD, HAIL, SNOWSTORM -> "weather rain " + ticks;
                      case STORM, HURRICANE, TORNADO -> "weather thunder " + ticks;
                      default -> "weather clear " + ticks;
                  };
                  runCommand(level, command);
              }

              private void runCommand(ServerLevel level, String command) {
                  MinecraftServer server = level.getServer();
                  server.getCommands().performPrefixedCommand(server.createCommandSourceStack().withSuppressedOutput(), command);
              }

              private void broadcast(List<ServerPlayer> players, String text) {
                  Component message = Component.literal(text);
                  for (ServerPlayer p : players) {
                      p.sendSystemMessage(message);
                  }
              }

              // ------------------------------------------------------------------ particles: clouds, rain, steam
              /** A dark cloud ceiling high above the player. */
              private void cloudDeck(ServerLevel level, ServerPlayer p, long time, int amount) {
                  if (time % 2 != 0) {
                      return;
                  }
                  for (int i = 0; i < amount; i++) {
                      double x = p.getX() + (random.nextDouble() - 0.5) * 64.0;
                      double z = p.getZ() + (random.nextDouble() - 0.5) * 64.0;
                      double y = p.getY() + 24.0 + random.nextDouble() * 10.0;
                      level.sendParticles(ParticleTypes.LARGE_SMOKE, x, y, z, 2, 4.0, 1.0, 4.0, 0.0);
                  }
              }

              private void rain(ServerLevel level, ServerPlayer p, long time, int amount) {
                  if (time % 2 != 0) {
                      return;
                  }
                  level.sendParticles(ParticleTypes.RAIN, p.getX(), p.getY() + 7.0, p.getZ(), amount, 12.0, 3.0, 12.0, 0.0);
              }

              /** Hot weather: steam rises from the water before the storm. */
              private void steam(ServerLevel level, List<ServerPlayer> players, long time) {
                  if (time % 10 != 0) {
                      return;
                  }
                  for (ServerPlayer p : players) {
                      for (int i = 0; i < 14; i++) {
                          int x = Mth.floor(p.getX()) + random.nextInt(49) - 24;
                          int z = Mth.floor(p.getZ()) + random.nextInt(49) - 24;
                          if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                              continue;
                          }
                          int y = level.getHeight(Heightmap.Types.WORLD_SURFACE, x, z) - 1;
                          BlockState s = level.getBlockState(new BlockPos(x, y, z));
                          if (s.getFluidState().is(FluidTags.WATER)) {
                              // count = 0 -> the offsets are the velocity: slowly rising steam
                              level.sendParticles(ParticleTypes.CLOUD, x + 0.5, y + 1.1, z + 0.5, 0, 0.0, 1.0, 0.0, 0.08);
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ lightning
              private void lightning(ServerLevel level, List<ServerPlayer> players, int minDelay, int maxDelay) {
                  if (--lightningTimer > 0) {
                      return;
                  }
                  lightningTimer = minDelay + random.nextInt(maxDelay - minDelay + 1);
                  ServerPlayer p = players.get(random.nextInt(players.size()));
                  double angle = random.nextDouble() * Math.PI * 2.0;
                  double dist = 12.0 + random.nextDouble() * 30.0;
                  strike(level, Mth.floor(p.getX() + Math.cos(angle) * dist), Mth.floor(p.getZ() + Math.sin(angle) * dist));
              }

              private void strike(ServerLevel level, int x, int z) {
                  if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                      return;
                  }
                  int y = level.getHeight(Heightmap.Types.WORLD_SURFACE, x, z);
                  runCommand(level, String.format(Locale.ROOT, "summon minecraft:lightning_bolt %d %d %d", x, y, z));
              }

              // ------------------------------------------------------------------ cloud wall + hail
              private String startWall(List<ServerPlayer> players, double distance) {
                  ServerPlayer target = players.get(random.nextInt(players.size()));
                  double angle = random.nextDouble() * Math.PI * 2.0;
                  wallX = target.getX() + Math.cos(angle) * distance;
                  wallZ = target.getZ() + Math.sin(angle) * distance;
                  wallDirX = -Math.cos(angle);
                  wallDirZ = -Math.sin(angle);
                  wallActive = true;
                  return compass(Math.cos(angle), Math.sin(angle));
              }

              private double[] nearestWallPoint(double px, double pz) {
                  double perpX = -wallDirZ;
                  double perpZ = wallDirX;
                  double along = Mth.clamp((px - wallX) * perpX + (pz - wallZ) * perpZ, -WALL_HALF_WIDTH, WALL_HALF_WIDTH);
                  return new double[] { wallX + perpX * along, wallZ + perpZ * along };
              }

              private double distToWall(double px, double pz) {
                  double[] c = nearestWallPoint(px, pz);
                  return Math.hypot(px - c[0], pz - c[1]);
              }

              private boolean inHailZone(double px, double pz) {
                  if (!wallActive) {
                      return false;
                  }
                  double dx = px - wallX;
                  double dz = pz - wallZ;
                  double ahead = dx * wallDirX + dz * wallDirZ;           // > 0 = wall has not reached us yet
                  double lateral = Math.abs(dx * -wallDirZ + dz * wallDirX);
                  return ahead <= WALL_HAIL_DISTANCE && ahead >= -HAIL_DEPTH && lateral <= WALL_HALF_WIDTH + 20.0;
              }

              private void tickWall(ServerLevel level, List<ServerPlayer> players, long time, boolean triggerHail) {
                  if (!wallActive) {
                      return;
                  }
                  wallX += wallDirX * WALL_SPEED;
                  wallZ += wallDirZ * WALL_SPEED;
                  double perpX = -wallDirZ;
                  double perpZ = wallDirX;

                  for (ServerPlayer p : players) {
                      double dist = distToWall(p.getX(), p.getZ());
                      if (triggerHail && dist <= WALL_HAIL_DISTANCE) {
                          begin(level, players, Type.HAIL);
                          return;
                      }
                      if (time % 2 == 0 && dist < 44.0) {
                          // a tall rolling wall: dark at the bottom, light on top
                          for (int i = 0; i < 16; i++) {
                              double t = (random.nextDouble() * 2.0 - 1.0) * WALL_HALF_WIDTH;
                              double roll = Math.sin(t * 0.25 + time * 0.1) * 2.0;
                              double x = wallX + perpX * t + wallDirX * roll;
                              double z = wallZ + perpZ * t + wallDirZ * roll;
                              if (Math.hypot(x - p.getX(), z - p.getZ()) > 34.0) {
                                  continue;
                              }
                              double h = random.nextDouble();
                              double y = p.getY() + 2.0 + h * 36.0;
                              if (h < 0.7) {
                                  level.sendParticles(ParticleTypes.LARGE_SMOKE, x, y, z, 3, 3.0, 2.0, 3.0, 0.0);
                              } else {
                                  level.sendParticles(ParticleTypes.CLOUD, x, y, z, 2, 3.0, 1.5, 3.0, 0.0);
                              }
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ 3D hail
              private void tickHail(ServerLevel level, List<ServerPlayer> players, long time) {
                  if (time % 2 != 0) {
                      return;
                  }
                  for (ServerPlayer p : players) {
                      if (p.isSpectator() || !inHailZone(p.getX(), p.getZ())) {
                          continue;
                      }
                      // hail all around the player
                      spawnHail(level, p.getX() + (random.nextDouble() - 0.5) * 28.0, p.getZ() + (random.nextDouble() - 0.5) * 28.0);
                      // sometimes one is aimed straight at the player
                      if (time % 20 == 0 && random.nextInt(HAIL_AIM_CHANCE) == 0) {
                          spawnHail(level, p.getX() + (random.nextDouble() - 0.5) * 0.8, p.getZ() + (random.nextDouble() - 0.5) * 0.8);
                      }
                  }
              }

              /** A hailstone is a small packed-ice block display that falls 14 blocks in 14 ticks. */
              private void spawnHail(ServerLevel level, double x, double z) {
                  if (hailstones.size() >= HAIL_MAX_IN_FLIGHT) {
                      return;
                  }
                  int bx = Mth.floor(x);
                  int bz = Mth.floor(z);
                  if (!level.hasChunkAt(new BlockPos(bx, 64, bz))) {
                      return;
                  }
                  int y = level.getHeight(Heightmap.Types.MOTION_BLOCKING, bx, bz);
                  int id = ++hailCounter;
                  hailstones.add(new Hail(id, x, y, z));
                  String nbt = "{Tags:[\"palhail\",\"palhail" + id + "\",\"palsess" + CloudField.INSTANCE.session() + "\"],block_state:{Name:\"minecraft:packed_ice\"},"
                          + "transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],scale:[0.3f,0.3f,0.3f],translation:[0f,14f,0f]},"
                          + "interpolation_duration:" + HAIL_FALL_TICKS + "}";
                  runCommand(level, String.format(Locale.ROOT, "summon minecraft:block_display %.2f %d %.2f ", x, y, z) + nbt);
              }

              private void tickHailstones(ServerLevel level, List<ServerPlayer> players) {
                  Iterator<Hail> it = hailstones.iterator();
                  while (it.hasNext()) {
                      Hail h = it.next();
                      h.age++;
                      if (h.age == 1) {
                          // start the fall animation
                          runCommand(level, "data merge entity @e[type=minecraft:block_display,tag=palhail" + h.id + ",limit=1] "
                                  + "{start_interpolation:0,transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],"
                                  + "scale:[0.3f,0.3f,0.3f],translation:[0f,0f,0f]}}");
                      }
                      if (h.age > HAIL_FALL_TICKS) {
                          landHail(level, players, h);
                          it.remove();
                      }
                  }
              }

              private void landHail(ServerLevel level, List<ServerPlayer> players, Hail h) {
                  runCommand(level, "kill @e[type=minecraft:block_display,tag=palhail" + h.id + "]");
                  runCommand(level, String.format(Locale.ROOT, "playsound minecraft:block.glass.break ambient @a %.2f %d %.2f 0.7 1.6", h.x, h.y, h.z));
                  level.sendParticles(ParticleTypes.ITEM_SNOWBALL, h.x, h.y + 0.2, h.z, 6, 0.2, 0.1, 0.2, 0.05);
                  for (ServerPlayer p : players) {
                      if (p.isSpectator()) {
                          continue;
                      }
                      // a player under a roof is far below the place where the stone landed, so only open-air players are hit
                      if (Math.hypot(p.getX() - h.x, p.getZ() - h.z) < 1.3 && Math.abs(p.getY() - h.y) < 2.5) {
                          p.hurtServer(level, level.damageSources().generic(), HAIL_DAMAGE);
                      }
                  }
              }

              // ------------------------------------------------------------------ tornado
              public static String rating(int wind) {
                  if (wind < MIN_WIND) {
                      return "weak";
                  }
                  if (wind <= 64) {
                      return "EFU";
                  }
                  if (wind <= 84) {
                      return "EF0";
                  }
                  if (wind <= 101) {
                      return "EF1";
                  }
                  if (wind <= 134) {
                      return "EF2";
                  }
                  if (wind <= 164) {
                      return "EF3";
                  }
                  if (wind <= 199) {
                      return "EF4";
                  }
                  if (wind <= 265) {
                      return "EF5";
                  }
                  return "EF5+";
              }

              private static float hardnessLimit(int wind) {
                  if (wind <= 64) {
                      return 0.2F;     // leaves, plants
                  }
                  if (wind <= 84) {
                      return 0.4F;     // + glass, wool, sand-like things
                  }
                  if (wind <= 101) {
                      return 0.8F;
                  }
                  if (wind <= 134) {
                      return 2.0F;     // wood
                  }
                  if (wind <= 164) {
                      return 3.0F;     // stone, brick
                  }
                  if (wind <= 199) {
                      return 5.0F;     // iron
                  }
                  if (wind <= 265) {
                      return 20.0F;
                  }
                  return 50.0F;
              }

              private String describeTornado() {
                  return rating(torWind) + " tornado, " + torWind + " mph, width " + torWidth + (torFire ? ", FIRE" : "");
              }

              private void rollTornado() {
                  if (pendingWind > 0) {
                      torWind = pendingWind;
                      torWidth = pendingWidth;
                      pendingWind = -1;
                      pendingWidth = -1;
                      return;
                  }
                  int r = random.nextInt(100);
                  if (r < 20) {
                      torWind = 45 + random.nextInt(20);
                  } else if (r < 45) {
                      torWind = 65 + random.nextInt(20);
                  } else if (r < 65) {
                      torWind = 85 + random.nextInt(17);
                  } else if (r < 80) {
                      torWind = 102 + random.nextInt(33);
                  } else if (r < 90) {
                      torWind = 135 + random.nextInt(30);
                  } else if (r < 97) {
                      torWind = 165 + random.nextInt(35);
                  } else if (r < 99) {
                      torWind = 200 + random.nextInt(66);
                  } else {
                      torWind = 266 + random.nextInt(MAX_WIND - 266 + 1);
                  }
                  int width = 30 + (int) (torWind * 1.2) + random.nextInt(120);
                  if (random.nextInt(100) < 12) {
                      width = (int) (width * 2.5);   // a wedge
                  }
                  torWidth = Mth.clamp(width, MIN_WIDTH, MAX_WIDTH);
              }

              private String startTornado(List<ServerPlayer> players) {
                  rollTornado();
                  ServerPlayer target = players.get(random.nextInt(players.size()));
                  double angle = random.nextDouble() * Math.PI * 2.0;
                  double dist = 60.0 + Math.min(torWidth / 2.0, 200.0);
                  if (wallActive) {
                      // the funnel drops from the cloud wall
                      torX = wallX + (-wallDirZ) * (random.nextDouble() * 40.0 - 20.0);
                      torZ = wallZ + wallDirX * (random.nextDouble() * 40.0 - 20.0);
                      angle = Math.atan2(torZ - target.getZ(), torX - target.getX());
                  } else {
                      torX = target.getX() + Math.cos(angle) * dist;
                      torZ = target.getZ() + Math.sin(angle) * dist;
                  }
                  torDirX = -Math.cos(angle);
                  torDirZ = -Math.sin(angle);
                  torAge = 0;
                  torFire = false;
                  tornadoActive = true;
                  return compass(Math.cos(angle), Math.sin(angle));
              }

              private ServerPlayer nearestPlayer(List<ServerPlayer> players, double x, double z) {
                  ServerPlayer best = players.get(0);
                  double bestDist = Double.MAX_VALUE;
                  for (ServerPlayer p : players) {
                      double d = Math.hypot(p.getX() - x, p.getZ() - z);
                      if (d < bestDist) {
                          bestDist = d;
                          best = p;
                      }
                  }
                  return best;
              }

              private void tickTornado(ServerLevel level, List<ServerPlayer> players, long time) {
                  if (!tornadoActive) {
                      return;
                  }
                  torAge++;
                  double progress = Math.min(1.0, torAge / (double) TORNADO_FORM_TICKS);
                  boolean touching = progress >= 1.0;
                  double radius = Math.min(500.0, torWidth / 2.0);
                  double height = 40.0 + torWidth * 0.04;

                  if (torAge == TORNADO_FORM_TICKS) {
                      broadcast(players, "TOUCHDOWN! " + describeTornado() + ".");
                  }

                  // drift slowly towards the nearest player, with some wobble
                  ServerPlayer nearest = nearestPlayer(players, torX, torZ);
                  double dx = nearest.getX() - torX;
                  double dz = nearest.getZ() - torZ;
                  double len = Math.max(1.0, Math.hypot(dx, dz));
                  torDirX = Mth.lerp(0.012, torDirX, dx / len) + (random.nextDouble() - 0.5) * 0.08;
                  torDirZ = Mth.lerp(0.012, torDirZ, dz / len) + (random.nextDouble() - 0.5) * 0.08;
                  double dirLen = Math.hypot(torDirX, torDirZ);
                  if (dirLen > 1.0E-6) {
                      torDirX /= dirLen;
                      torDirZ /= dirLen;
                  }
                  double speed = (TORNADO_SPEED + torWind * 0.0002) * (0.3 + 0.7 * progress);
                  torX += torDirX * speed;
                  torZ += torDirZ * speed;

                  int bx = Mth.floor(torX);
                  int bz = Mth.floor(torZ);
                  if (!level.hasChunkAt(new BlockPos(bx, 64, bz))) {
                      return;
                  }
                  int groundY = level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, bx, bz);

                  // the wall cloud follows the tornado
                  wallX = torX;
                  wallZ = torZ;

                  drawFunnel(level, players, time, groundY, radius, height, progress);
                  drawParentCloud(level, players, time, groundY, radius, height);

                  // sometimes lightning hits near the tornado
                  if (--lightningTimer <= 0) {
                      lightningTimer = 50 + random.nextInt(60);
                      if (random.nextBoolean()) {
                          strike(level, Mth.floor(torX + (random.nextDouble() - 0.5) * 80.0), Mth.floor(torZ + (random.nextDouble() - 0.5) * 80.0));
                      } else {
                          ServerPlayer p = players.get(random.nextInt(players.size()));
                          strike(level, Mth.floor(p.getX() + (random.nextDouble() - 0.5) * 60.0), Mth.floor(p.getZ() + (random.nextDouble() - 0.5) * 60.0));
                      }
                  }

                  if (!touching) {
                      return;     // it can only hurt when it touches the ground
                  }
                  tornadoEntities(level, time, groundY, radius);
                  tornadoBreak(level, players, time, radius);
                  tornadoFire(level, time, groundY, radius);
              }

              private void drawFunnel(ServerLevel level, List<ServerPlayer> players, long time, int groundY,
                                      double radius, double height, double progress) {
                  if (time % 2 != 0) {
                      return;
                  }
                  double bottom = height * (1.0 - progress);     // the funnel lowers from the cloud until it touches the ground
                  for (ServerPlayer p : players) {
                      double toPlayer = Math.hypot(p.getX() - torX, p.getZ() - torZ);
                      if (toPlayer > radius + 60.0) {
                          continue;
                      }
                      int samples = 60 + Math.min(120, torWidth / 10);
                      double base = Math.atan2(p.getZ() - torZ, p.getX() - torX);
                      for (int i = 0; i < samples; i++) {
                          double h = bottom + random.nextDouble() * (height - bottom);
                          double t = h / height;
                          double r = radius * (0.18 + 0.82 * Math.pow(t, 1.4));
                          double spread = Math.PI;
                          double centerAngle = 0.0;
                          if (r > 36.0) {
                              spread = Math.asin(Math.min(1.0, 36.0 / r));
                              centerAngle = base;
                          }
                          double a = centerAngle + (random.nextDouble() * 2.0 - 1.0) * spread;
                          double x = torX + Math.cos(a) * r;
                          double z = torZ + Math.sin(a) * r;
                          if (Math.hypot(x - p.getX(), z - p.getZ()) > 34.0) {
                              continue;
                          }
                          // count = 0 -> offsets are the velocity: the particles spin around the funnel
                          double vx = -Math.sin(a);
                          double vz = Math.cos(a);
                          if (torFire && i % 3 == 0) {
                              level.sendParticles(ParticleTypes.FLAME, x, groundY + h, z, 0, vx, 0.35, vz, 0.5);
                          } else if (torFire && i % 7 == 0) {
                              level.sendParticles(ParticleTypes.LAVA, x, groundY + h, z, 1, 0.3, 0.3, 0.3, 0.0);
                          } else if (i % 5 == 0) {
                              level.sendParticles(ParticleTypes.CAMPFIRE_COSY_SMOKE, x, groundY + h, z, 0, vx, 0.3, vz, 0.5);
                          } else {
                              level.sendParticles(ParticleTypes.LARGE_SMOKE, x, groundY + h, z, 0, vx, 0.3, vz, 0.6);
                          }
                          // dust and debris near the ground
                          if (h < 8.0 && progress >= 1.0) {
                              level.sendParticles(ParticleTypes.ASH, x, groundY + 0.5 + random.nextDouble() * 4.0, z, 2, 1.5, 1.0, 1.5, 0.1);
                          }
                      }
                  }
              }

              /** The dark rotating cloud above the tornado. */
              private void drawParentCloud(ServerLevel level, List<ServerPlayer> players, long time, int groundY,
                                           double radius, double height) {
                  if (time % 2 != 0) {
                      return;
                  }
                  double cloudRadius = Math.max(45.0, radius * 1.1);
                  for (ServerPlayer p : players) {
                      for (int i = 0; i < 12; i++) {
                          double x = p.getX() + (random.nextDouble() - 0.5) * 64.0;
                          double z = p.getZ() + (random.nextDouble() - 0.5) * 64.0;
                          if (Math.hypot(x - torX, z - torZ) > cloudRadius) {
                              continue;
                          }
                          level.sendParticles(ParticleTypes.LARGE_SMOKE, x, groundY + height + random.nextDouble() * 6.0, z, 3, 3.0, 1.5, 3.0, 0.0);
                      }
                  }
              }

              private void tornadoEntities(ServerLevel level, long time, int groundY, double radius) {
                  if (time % 4 != 0) {
                      return;
                  }
                  double maxLift = groundY + 8.0 + torWind / 12.0;
                  AABB box = new AABB(torX - radius, groundY - 4, torZ - radius, torX + radius, maxLift + 20.0, torZ + radius);
                  double swirl = (0.02 + torWind * 0.0003) * 2.0;     // the push is applied every 4 ticks
                  int amplifier = Mth.clamp(torWind / 35, 1, 10);
                  double core = Math.max(3.0, radius * 0.35);
                  for (LivingEntity e : level.getEntitiesOfClass(LivingEntity.class, box)) {
                      if (e.isSpectator()) {
                          continue;
                      }
                      double ex = torX - e.getX();
                      double ez = torZ - e.getZ();
                      double d = Math.max(0.5, Math.hypot(ex, ez));
                      if (d > radius) {
                          continue;
                      }
                      // swirl around + a little inward pull
                      e.push((ez / d) * swirl + (ex / d) * swirl * 0.4, 0.0, (-ex / d) * swirl + (ez / d) * swirl * 0.4);
                      if (e.getY() < maxLift) {
                          e.addEffect(new MobEffectInstance(MobEffects.LEVITATION, 14, amplifier, false, false));
                      }
                      if (torFire && d < radius * 0.6) {
                          e.setRemainingFireTicks(100);
                      }
                      if (torWind >= 100 && d < core && time % 20 == 0) {
                          e.hurtServer(level, level.damageSources().generic(), (float) ((torWind - 80) / 15.0));
                      }
                  }
              }

              /** What the tornado can rip out depends on its wind speed. */
              private void tornadoBreak(ServerLevel level, List<ServerPlayer> players, long time, double radius) {
                  if (time % 4 != 0) {
                      return;
                  }
                  int count = Math.min(120, 20 + torWidth / 12);
                  float limit = hardnessLimit(torWind);
                  for (int i = 0; i < count; i++) {
                      double cx = torX;
                      double cz = torZ;
                      double r = Math.min(radius, 48.0);
                      if (random.nextBoolean()) {
                          // half of the damage happens around players who stand inside a big tornado
                          ServerPlayer p = players.get(random.nextInt(players.size()));
                          if (Math.hypot(p.getX() - torX, p.getZ() - torZ) <= radius) {
                              cx = p.getX();
                              cz = p.getZ();
                              r = 24.0;
                          }
                      }
                      double a = random.nextDouble() * Math.PI * 2.0;
                      double dd = Math.sqrt(random.nextDouble()) * r;
                      int x = Mth.floor(cx + Math.cos(a) * dd);
                      int z = Mth.floor(cz + Math.sin(a) * dd);
                      if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                          continue;
                      }
                      int gy = level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, x, z);
                      BlockPos bp = new BlockPos(x, gy - 4 + random.nextInt(16), z);
                      BlockState s = level.getBlockState(bp);
                      if (s.isAir() || !s.getFluidState().isEmpty()) {
                          continue;
                      }
                      float hardness = s.getDestroySpeed(level, bp);
                      if (hardness < 0.0F || hardness > limit) {
                          continue;
                      }
                      boolean terrain = s.is(BlockTags.MINEABLE_WITH_SHOVEL) || s.is(BlockTags.BASE_STONE_OVERWORLD);
                      if (terrain && torWind < 200) {
                          continue;       // only EF5 scours the ground itself
                      }
                      level.destroyBlock(bp, false);
                  }
              }

              private BlockPos randomAround(double cx, double cz, double r, int y) {
                  double a = random.nextDouble() * Math.PI * 2.0;
                  double d = Math.sqrt(random.nextDouble()) * r;
                  return new BlockPos(Mth.floor(cx + Math.cos(a) * d), y, Mth.floor(cz + Math.sin(a) * d));
              }

              /** EF1 - EF3 can catch fire when they touch it (EF1/EF2 sometimes, EF3 rarely). EF4 and EF5 never. */
              private void tornadoFire(ServerLevel level, long time, int groundY, double radius) {
                  if (time % 10 != 0) {
                      return;
                  }
                  double r = Math.min(radius, 40.0);
                  if (!torFire) {
                      if (torWind < 85 || torWind > 164) {
                          return;
                      }
                      for (int i = 0; i < 8; i++) {
                          BlockPos bp = randomAround(torX, torZ, r, groundY - 1 + random.nextInt(5));
                          if (level.hasChunkAt(bp) && level.getBlockState(bp).is(BlockTags.FIRE)) {
                              int chance = torWind <= 134 ? 25 : 8;
                              if (random.nextInt(100) < chance) {
                                  torFire = true;
                                  broadcast(level.players(), "The tornado touched fire! It is a FIRE TORNADO!");
                              }
                              return;
                          }
                      }
                  } else {
                      for (int i = 0; i < 6; i++) {
                          BlockPos bp = randomAround(torX, torZ, r, groundY + random.nextInt(3));
                          if (level.hasChunkAt(bp) && level.getBlockState(bp).isAir()
                                  && Blocks.FIRE.defaultBlockState().canSurvive(level, bp)) {
                              level.setBlockAndUpdate(bp, Blocks.FIRE.defaultBlockState());
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ hurricane
              private String startHurricane(List<ServerPlayer> players) {
                  ServerPlayer target = players.get(random.nextInt(players.size()));
                  double angle = random.nextDouble() * Math.PI * 2.0;
                  double lateral = (random.nextDouble() - 0.5) * 60.0;
                  hurX = target.getX() + Math.cos(angle) * 260.0 + (-Math.sin(angle)) * lateral;
                  hurZ = target.getZ() + Math.sin(angle) * 260.0 + Math.cos(angle) * lateral;
                  hurDirX = -Math.cos(angle);
                  hurDirZ = -Math.sin(angle);
                  return compass(Math.cos(angle), Math.sin(angle));
              }

              /** 0 in the eye, 1 in the eye wall, then it fades away to 0 at 260 blocks. */
              private double hurricaneProfile(double d) {
                  if (d < 28.0) {
                      return 0.0;
                  }
                  if (d < 90.0) {
                      return 1.0;
                  }
                  if (d < 260.0) {
                      return Math.max(0.1, 1.0 - (d - 90.0) / 170.0);
                  }
                  return 0.0;
              }

              private void tickHurricane(ServerLevel level, List<ServerPlayer> players, long time) {
                  hurX += hurDirX * 0.12;
                  hurZ += hurDirZ * 0.12;
                  double nearestProfile = 0.0;
                  for (ServerPlayer p : players) {
                      if (p.isSpectator()) {
                          continue;
                      }
                      double rx = p.getX() - hurX;
                      double rz = p.getZ() - hurZ;
                      double d = Math.max(1.0, Math.hypot(rx, rz));
                      double profile = hurricaneProfile(d);
                      nearestProfile = Math.max(nearestProfile, profile);

                      if (profile > 0.0) {
                          cloudDeck(level, p, time, 3 + (int) (profile * 8.0));
                          rain(level, p, time, 10 + (int) (profile * 30.0));
                      }
                      if (time % 2 == 0 && profile > 0.0 && level.canSeeSky(p.blockPosition())) {
                          // the wind goes around the eye and a little inward
                          double wx = (-rz / d) * 0.9 + (-rx / d) * 0.4;
                          double wz = (rx / d) * 0.9 + (-rz / d) * 0.4;
                          double wl = Math.max(0.01, Math.hypot(wx, wz));
                          p.push(wx / wl * 0.06 * profile, 0.0, wz / wl * 0.06 * profile);
                      }
                      if (time % 3 == 0 && profile > 0.0) {
                          for (int arm = 0; arm < 3; arm++) {
                              for (int r = 6; r <= 30; r += 4) {
                                  double a = time * 0.05 + r * 0.14 + arm * (Math.PI * 2.0 / 3.0);
                                  level.sendParticles(ParticleTypes.LARGE_SMOKE,
                                          p.getX() + Math.cos(a) * r, p.getY() + 20.0 + r * 0.2, p.getZ() + Math.sin(a) * r,
                                          2, 1.5, 0.7, 1.5, 0.0);
                              }
                          }
                      }
                  }
                  // more lightning in the eye wall
                  if (nearestProfile > 0.0) {
                      lightning(level, players, nearestProfile > 0.6 ? 30 : 70, nearestProfile > 0.6 ? 70 : 140);
                  }
              }

              // ------------------------------------------------------------------ flood
              private void startFlood(List<ServerPlayer> players) {
                  ServerPlayer center = players.get(random.nextInt(players.size()));
                  floodCX = center.getX();
                  floodCZ = center.getZ();
                  floodBaseY = center.blockPosition().getY() - 1;
                  floodLevel = floodBaseY;
                  floodRadius = 24.0;
              }

              /** The flood belongs to the land, not to the players: it covers a circle that keeps growing. */
              private void tickFlood(ServerLevel level, List<ServerPlayer> players, long time) {
                  floodLevel = Math.min(floodLevel + FLOOD_RISE_PER_TICK, floodBaseY + FLOOD_MAX_RISE);
                  floodRadius = Math.min(150.0, 24.0 + phaseTicks * 0.04);
                  for (ServerPlayer p : players) {
                      rain(level, p, time, 40);
                      cloudDeck(level, p, time, 5);
                  }
                  if (time % 10 != 0) {
                      return;
                  }
                  int floodY = Mth.floor(floodLevel);
                  for (int i = 0; i < FLOOD_COLUMNS; i++) {
                      double a = random.nextDouble() * Math.PI * 2.0;
                      double d = Math.sqrt(random.nextDouble()) * floodRadius;
                      int x = Mth.floor(floodCX + Math.cos(a) * d);
                      int z = Mth.floor(floodCZ + Math.sin(a) * d);
                      if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                          continue;
                      }
                      int y = level.getHeight(Heightmap.Types.OCEAN_FLOOR, x, z);
                      BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos(x, y, z);
                      while (pos.getY() <= floodY) {
                          BlockState s = level.getBlockState(pos);
                          if (s.getFluidState().is(FluidTags.WATER)) {
                              pos.move(Direction.UP); // already wet, look one higher
                              continue;
                          }
                          if (s.isAir() || s.canBeReplaced()) {
                              level.setBlockAndUpdate(pos, Blocks.WATER.defaultBlockState());
                              floodBlocks.addLast(pos.asLong());
                          }
                          break;
                      }
                  }
                  washAway(level, floodY);
              }

              /** The flood tears weak blocks (plants, torches, crops, glass ...) out of the ground when the water touches them. */
              private void washAway(ServerLevel level, int floodY) {
                  for (int i = 0; i < 60; i++) {
                      double a = random.nextDouble() * Math.PI * 2.0;
                      double d = Math.sqrt(random.nextDouble()) * floodRadius;
                      int x = Mth.floor(floodCX + Math.cos(a) * d);
                      int z = Mth.floor(floodCZ + Math.sin(a) * d);
                      if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                          continue;
                      }
                      int low = floodBaseY - 2;
                      int top = Math.min(floodY, level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, x, z) + 2);
                      int y = low + random.nextInt(Math.max(1, top - low + 1));
                      BlockPos bp = new BlockPos(x, y, z);
                      BlockState s = level.getBlockState(bp);
                      if (s.isAir() || !s.getFluidState().isEmpty()) {
                          continue;
                      }
                      float hardness = s.getDestroySpeed(level, bp);
                      if (hardness < 0.0F || hardness > 0.6F) {
                          continue;
                      }
                      if (s.is(BlockTags.LEAVES) || s.is(BlockTags.MINEABLE_WITH_SHOVEL) || s.is(BlockTags.BASE_STONE_OVERWORLD)) {
                          continue;
                      }
                      boolean wet = false;
                      for (Direction dir : Direction.values()) {
                          if (level.getFluidState(bp.relative(dir)).is(FluidTags.WATER)) {
                              wet = true;
                              break;
                          }
                      }
                      if (wet) {
                          level.destroyBlock(bp, false);
                      }
                  }
              }

              // ------------------------------------------------------------------ snow storm, ice, thaw
              private void tickSnowstorm(ServerLevel level, List<ServerPlayer> players, long time) {
                  for (ServerPlayer p : players) {
                      if (time % 2 == 0) {
                          // snow blown by the wind
                          level.sendParticles(ParticleTypes.SNOWFLAKE, p.getX(), p.getY() + 7.0, p.getZ(), 60, 14.0, 5.0, 14.0, 0.08);
                          level.sendParticles(ParticleTypes.WHITE_ASH, p.getX(), p.getY() + 5.0, p.getZ(), 10, 14.0, 4.0, 14.0, 0.05);
                      }
                      cloudDeck(level, p, time, 3);
                      // freezing like powder snow - leather armor protects
                      if (!p.isSpectator() && level.canSeeSky(p.blockPosition())) {
                          p.setTicksFrozen(Math.min(p.getTicksFrozen() + 3, p.getTicksRequiredToFreeze() + 40));
                      }
                      if (time % 10 == 0) {
                          for (int i = 0; i < 40; i++) {
                              int x = Mth.floor(p.getX()) + random.nextInt(57) - 28;
                              int z = Mth.floor(p.getZ()) + random.nextInt(57) - 28;
                              if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                                  continue;
                              }
                              int y = level.getHeight(Heightmap.Types.MOTION_BLOCKING, x, z);
                              pileSnow(level, new BlockPos(x, y, z));
                          }
                      }
                  }
              }

              /** New snow starts as one layer and the pile grows higher and higher while it snows. */
              private void pileSnow(ServerLevel level, BlockPos pos) {
                  BlockState here = level.getBlockState(pos);
                  BlockPos below = pos.below();
                  BlockState under = level.getBlockState(below);
                  if (here.is(Blocks.SNOW) && snowSet.contains(pos.asLong())) {
                      growSnow(level, pos, here);
                  } else if (under.is(Blocks.SNOW) && snowSet.contains(below.asLong())) {
                      growSnow(level, below, under);
                  } else if (here.isAir()) {
                      BlockState snow = Blocks.SNOW.defaultBlockState();
                      if (snow.canSurvive(level, pos)) {
                          level.setBlockAndUpdate(pos, snow);
                          snowBlocks.addLast(pos.asLong());
                          snowSet.add(pos.asLong());
                      }
                  }
              }

              private void growSnow(ServerLevel level, BlockPos pos, BlockState state) {
                  int layers = state.getValue(BlockStateProperties.LAYERS);
                  if (layers < SNOW_MAX_LAYERS) {
                      level.setBlockAndUpdate(pos, state.setValue(BlockStateProperties.LAYERS, layers + 1));
                  }
              }

              /** The sun is out: every snow pile loses one layer at a time. */
              private void meltSnow(ServerLevel level, int perTick) {
                  int done = 0;
                  while (done < perTick && !snowBlocks.isEmpty()) {
                      done++;
                      long key = snowBlocks.pollLast();
                      BlockPos pos = BlockPos.of(key);
                      if (!level.hasChunkAt(pos)) {
                          snowSet.remove(key);
                          continue;
                      }
                      BlockState s = level.getBlockState(pos);
                      if (!s.is(Blocks.SNOW)) {
                          snowSet.remove(key);
                          continue;
                      }
                      int layers = s.getValue(BlockStateProperties.LAYERS);
                      if (layers > 1) {
                          level.setBlockAndUpdate(pos, s.setValue(BlockStateProperties.LAYERS, layers - 1));
                          snowBlocks.addFirst(key);       // melt it a bit more next time
                      } else {
                          level.setBlockAndUpdate(pos, Blocks.AIR.defaultBlockState());
                          snowSet.remove(key);
                      }
                  }
              }

              private void tickIce(ServerLevel level, List<ServerPlayer> players, long time) {
                  if (time % 10 != 0) {
                      return;
                  }
                  for (ServerPlayer p : players) {
                      for (int i = 0; i < 40; i++) {
                          int x = Mth.floor(p.getX()) + random.nextInt(69) - 34;
                          int z = Mth.floor(p.getZ()) + random.nextInt(69) - 34;
                          if (!level.hasChunkAt(new BlockPos(x, 64, z))) {
                              continue;
                          }
                          int y = level.getHeight(Heightmap.Types.WORLD_SURFACE, x, z) - 1;
                          BlockPos pos = new BlockPos(x, y, z);
                          BlockState s = level.getBlockState(pos);
                          if (s.is(Blocks.WATER) && s.getFluidState().isSource()) {
                              level.setBlockAndUpdate(pos, Blocks.ICE.defaultBlockState());
                              iceBlocks.addLast(pos.asLong());
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ cleanup helper
              private static void drain(ArrayDeque<Long> queue, ServerLevel level, int perTick, Block expected, BlockState replacement) {
                  int done = 0;
                  while (done < perTick && !queue.isEmpty()) {
                      done++;
                      BlockPos pos = BlockPos.of(queue.pollLast());
                      if (!level.hasChunkAt(pos)) {
                          continue;
                      }
                      if (level.getBlockState(pos).is(expected)) {
                          level.setBlockAndUpdate(pos, replacement);
                      }
                  }
              }

              // ------------------------------------------------------------------ radar screen (particles above the radar block)
              private void tickRadars(ServerLevel level, long time) {
                  if (radars.isEmpty() || time % 8 != 0) {
                      return;
                  }
                  Iterator<Map.Entry<Long, Long>> it = radars.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<Long, Long> entry = it.next();
                      BlockPos pos = BlockPos.of(entry.getKey());
                      if (time > entry.getValue() || !level.hasChunkAt(pos) || !(level.getBlockState(pos).getBlock() instanceof RadarBlock)) {
                          it.remove();
                          continue;
                      }
                      drawRadar(level, pos);
                  }
              }

              private void drawRadar(ServerLevel level, BlockPos pos) {
                  double cx = pos.getX() + 0.5;
                  double cz = pos.getZ() + 0.5;
                  double y = pos.getY() + 2.2;
                  for (int gz = -RADAR_SIZE; gz <= RADAR_SIZE; gz++) {
                      for (int gx = -RADAR_SIZE; gx <= RADAR_SIZE; gx++) {
                          int cls = echo(cx + gx * RADAR_CELL, cz + gz * RADAR_CELL);
                          if (cls > 0) {
                              level.sendParticles(RADAR_PARTICLES[cls], cx + gx * RADAR_SPACING, y, cz + gz * RADAR_SPACING, 1, 0.0, 0.0, 0.0, 0.0);
                          }
                      }
                  }
                  level.sendParticles(ParticleTypes.END_ROD, cx, y + 0.3, cz, 1, 0.0, 0.0, 0.0, 0.0);   // the radar itself
              }

              private double noise(double x, double z) {
                  double v = Math.sin(x * 0.03) + Math.sin(z * 0.037 + 1.3) + Math.sin((x + z) * 0.021 + 2.1) + Math.sin((x - z) * 0.047 + 0.4);
                  return (v + 4.0) / 8.0;
              }

              private int echoLevel(double v) {
                  if (v < 0.12) {
                      return 0;
                  }
                  if (v < 0.35) {
                      return 1;
                  }
                  if (v < 0.55) {
                      return 2;
                  }
                  if (v < 0.75) {
                      return 3;
                  }
                  return 4;
              }

              private int blob(double x, double z, double cx, double cz, double radius) {
                  double d = Math.hypot(x - cx, z - cz);
                  return echoLevel(1.0 - d / radius + (noise(x, z) - 0.5) * 0.5);
              }

              /** What the radar sees at this place: 0 nothing, 1 green ... 4 red, 5 purple, 6 blue, 7 white. */
              private int echo(double x, double z) {
                  switch (type) {
                      case RAIN:
                          return Math.min(2, blob(x, z, cellX, cellZ, 150.0));
                      case STORM:
                          return blob(x, z, cellX, cellZ, 130.0);
                      case CLOUD_WALL:
                      case HAIL:
                          return wallEcho(x, z);
                      case TORNADO: {
                          int parent = Math.min(4, blob(x, z, torX, torZ, 120.0));
                          double core = Math.max(16.0, Math.min(500.0, torWidth / 2.0) * 0.6);
                          if (tornadoActive && Math.hypot(x - torX, z - torZ) <= core) {
                              return 5;
                          }
                          return parent;
                      }
                      case HURRICANE: {
                          double rx = x - hurX;
                          double rz = z - hurZ;
                          double d = Math.hypot(rx, rz);
                          if (d < 22.0 || d > 240.0) {
                              return 0;       // the eye is empty
                          }
                          double phase = Math.atan2(rz, rx) - d * 0.04;
                          double arm = 0.5 + 0.5 * Math.sin(phase * 2.0);
                          double v = (1.0 - d / 240.0) * 0.7 + arm * 0.45 + (d < 60.0 ? 0.35 : 0.0);
                          return echoLevel(v - 0.1);
                      }
                      case FLOOD: {
                          double d = Math.hypot(x - floodCX, z - floodCZ);
                          if (d <= floodRadius) {
                              return 6;
                          }
                          return d <= floodRadius + 60.0 ? 1 : 0;
                      }
                      case SNOWSTORM:
                          return noise(x, z) > 0.35 ? 7 : 0;
                      case ICE:
                          return blob(x, z, cellX, cellZ, 160.0) > 0 ? 7 : 0;
                      default:
                          return 0;
                  }
              }

              private int wallEcho(double x, double z) {
                  if (!wallActive) {
                      return 0;
                  }
                  double dx = x - wallX;
                  double dz = z - wallZ;
                  double ahead = dx * wallDirX + dz * wallDirZ + (noise(x, z) - 0.5) * 30.0;
                  double lateral = Math.abs(dx * -wallDirZ + dz * wallDirX);
                  if (lateral > WALL_HALF_WIDTH + 40.0 || ahead > 15.0 || ahead < -170.0) {
                      return 0;
                  }
                  if (ahead >= -8.0) {
                      return type == Type.HAIL ? 5 : 4;      // the front of the wall (hail core is purple)
                  }
                  if (ahead >= -15.0) {
                      return 4;
                  }
                  if (ahead >= -60.0) {
                      return 3;
                  }
                  if (ahead >= -110.0) {
                      return 2;
                  }
                  return 1;
              }

              // ------------------------------------------------------------------ radar text
              private static final String[] DIRECTIONS = { "E", "SE", "S", "SW", "W", "NW", "N", "NE" };

              /** dx/dz = vector from you to the thing. +x = east, +z = south. */
              public static String compass(double dx, double dz) {
                  double degrees = Math.toDegrees(Math.atan2(dz, dx));
                  int index = Math.floorMod((int) Math.round(degrees / 45.0), 8);
                  return DIRECTIONS[index];
              }

              public List<String> radarReport(double rx, double rz) {
                  List<String> out = new ArrayList<>();
                  out.add("=== Weather Radar ===");
                  out.add("Weather: " + type.label + (auto ? " (" + Math.max(0, ticksLeft / 20) + "s left)" : " (locked)"));
                  out.add("Climate: " + climate.name().toLowerCase(Locale.ROOT) + (climateLocked ? " (locked)" : ""));
                  if (wallActive && (type == Type.CLOUD_WALL || type == Type.HAIL)) {
                      double[] c = nearestWallPoint(rx, rz);
                      long dist = Math.round(Math.hypot(c[0] - rx, c[1] - rz));
                      out.add("Cloud wall: " + dist + " blocks " + compass(c[0] - rx, c[1] - rz)
                              + (type == Type.CLOUD_WALL ? " - hail behind it!" : " - hail zone"));
                  }
                  if (tornadoActive && type == Type.TORNADO) {
                      long dist = Math.round(Math.hypot(torX - rx, torZ - rz));
                      String state = torAge < TORNADO_FORM_TICKS ? "funnel forming" : describeTornado();
                      out.add("TORNADO: " + dist + " blocks " + compass(torX - rx, torZ - rz) + " - " + state);
                  }
                  if (type == Type.HURRICANE) {
                      long dist = Math.round(Math.hypot(hurX - rx, hurZ - rz));
                      out.add("Hurricane eye: " + dist + " blocks " + compass(hurX - rx, hurZ - rz) + " - stay inside.");
                  }
                  if (type == Type.FLOOD) {
                      long dist = Math.round(Math.hypot(floodCX - rx, floodCZ - rz));
                      out.add("Flood: center " + dist + " blocks " + compass(floodCX - rx, floodCZ - rz)
                              + ", radius " + Math.round(floodRadius) + ", water level +" + Math.round((floodLevel - floodBaseY) * 10.0) / 10.0);
                  }
                  if (type == Type.SNOWSTORM || type == Type.ICE) {
                      out.add("Cold: snow piles up and water freezes. Leather armor protects against freezing.");
                  }
                  if (type == Type.THAW) {
                      out.add("The sun is out. Snow and ice are melting.");
                  }
                  return out;
              }

              public List<String> radarLegend() {
                  List<String> out = new ArrayList<>();
                  out.add("Radar colors: green = light rain, yellow = rain, orange = heavy rain, red = storm / hail,");
                  out.add("purple = tornado or hail core, blue = flood, white = snow / ice. The empty hole in a hurricane is the eye.");
                  return out;
              }
          }
