          package com.palweathers;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          import net.minecraft.commands.CommandSourceStack;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.util.Mth;
          import net.minecraft.util.RandomSource;

          /**
           * "PRO clouds": real 3D clouds built from many block-display cubes (up to MESH_MAX cubes at once).
           * They replace the flat Minecraft clouds. Turn the normal clouds off in
           * Options > Video Settings > Clouds = Off, then only these clouds are left.
           *
           * Mood: 0 = white fair-weather clouds, 1 = grey clouds, 2 = dark storm clouds.
           */
          public final class CloudField {
              public static final CloudField INSTANCE = new CloudField();

              public static final int MESH_MAX = 1000;       // most cloud cubes alive at the same time
              private static final int COMMANDS_PER_TICK = 12;

              private static final class Cell {
                  final int id;
                  final int puffs;
                  final int mood;
                  final int life;      // ticks
                  double x;
                  double z;
                  int age = 0;

                  Cell(int id, int puffs, int mood, int life, double x, double z) {
                      this.id = id;
                      this.puffs = puffs;
                      this.mood = mood;
                      this.life = life;
                      this.x = x;
                      this.z = z;
                  }
              }

              private final RandomSource random = RandomSource.create();
              private final ArrayDeque<String> commands = new ArrayDeque<>();
              private final ArrayList<Cell> cells = new ArrayList<>();
              private int counter = 0;
              private int puffTotal = 0;
              private boolean enabled = true;
              private String session = Long.toString(System.nanoTime() % 1000000L);
              private double windX = 0.03;      // blocks per tick
              private double windZ = 0.012;

              private CloudField() {
              }

              public String session() {
                  return session;
              }

              public boolean isEnabled() {
                  return enabled;
              }

              /** New session: cloud cubes saved by an older session (after a crash) are thrown away when they load. */
              public void reset() {
                  session = Long.toString(System.nanoTime() % 1000000L);
                  commands.clear();
                  cells.clear();
                  puffTotal = 0;
              }

              public boolean isStale(Set<String> tags) {
                  boolean ours = tags.contains("palcloud") || tags.contains("palhail");
                  return ours && !tags.contains("palsess" + session);
              }

              public void setEnabled(ServerLevel level, boolean on) {
                  enabled = on;
                  if (!on) {
                      killAll(level);
                  }
              }

              public void killAll(ServerLevel level) {
                  commands.clear();
                  cells.clear();
                  puffTotal = 0;
                  run(level, "kill @e[type=minecraft:block_display,tag=palcloud]");
              }

              public int cubeCount() {
                  return puffTotal;
              }

              public int cloudCount() {
                  return cells.size();
              }

              private void run(ServerLevel level, String command) {
                  MinecraftServer server = level.getServer();
                  server.getCommands().performPrefixedCommand(server.createCommandSourceStack().withSuppressedOutput(), command);
              }

              private void flush(ServerLevel level) {
                  if (commands.isEmpty()) {
                      return;
                  }
                  MinecraftServer server = level.getServer();
                  CommandSourceStack source = server.createCommandSourceStack().withSuppressedOutput();
                  for (int i = 0; i < COMMANDS_PER_TICK && !commands.isEmpty(); i++) {
                      server.getCommands().performPrefixedCommand(source, commands.pollFirst());
                  }
              }

              public void tick(ServerLevel level, List<ServerPlayer> players, int mood, long time) {
                  flush(level);
                  if (!enabled || players.isEmpty()) {
                      return;
                  }

                  // the wind slowly changes direction
                  if (time % 200 == 0) {
                      double a = Math.atan2(windZ, windX) + (random.nextDouble() - 0.5) * 0.6;
                      double speed = 0.02 + random.nextDouble() * 0.02;
                      windX = Math.cos(a) * speed;
                      windZ = Math.sin(a) * speed;
                  }

                  // the clouds drift (the cubes glide smoothly because of teleport_duration)
                  if (time % 40 == 0) {
                      double dx = windX * 40.0;
                      double dz = windZ * 40.0;
                      for (Cell c : cells) {
                          c.x += dx;
                          c.z += dz;
                          commands.add(String.format(Locale.ROOT, "tp @e[type=minecraft:block_display,tag=palcloud%d] ~%.3f ~ ~%.3f", c.id, dx, dz));
                      }
                  }

                  // old clouds go away, clouds of the wrong mood fade out one by one, far clouds are removed
                  if (time % 20 == 0) {
                      Iterator<Cell> it = cells.iterator();
                      while (it.hasNext()) {
                          Cell c = it.next();
                          c.age += 20;
                          boolean far = true;
                          for (ServerPlayer p : players) {
                              if (Math.hypot(p.getX() - c.x, p.getZ() - c.z) < 190.0) {
                                  far = false;
                                  break;
                              }
                          }
                          boolean wrongMood = c.mood != mood && random.nextInt(8) == 0;
                          if (c.age >= c.life || far || wrongMood) {
                              commands.add("kill @e[type=minecraft:block_display,tag=palcloud" + c.id + "]");
                              puffTotal -= c.puffs;
                              it.remove();
                          }
                      }
                  }

                  // new clouds
                  if (time % 10 == 0 && commands.size() < 150) {
                      int wanted = mood == 2 ? 18 : (mood == 1 ? 14 : 12);
                      if (cells.size() < wanted) {
                          spawnCell(players, mood);
                      }
                  }
              }

              private String blockFor(int mood) {
                  int r = random.nextInt(10);
                  if (mood == 0) {
                      return r < 8 ? "minecraft:white_concrete" : "minecraft:light_gray_concrete";
                  }
                  if (mood == 1) {
                      return r < 7 ? "minecraft:light_gray_concrete" : "minecraft:gray_concrete";
                  }
                  return r < 6 ? "minecraft:gray_concrete" : (r < 8 ? "minecraft:black_concrete" : "minecraft:light_gray_concrete");
              }

              private static String f(double v) {
                  return String.format(Locale.ROOT, "%.3f", v) + "f";
              }

              private void spawnCell(List<ServerPlayer> players, int mood) {
                  ServerPlayer p = players.get(random.nextInt(players.size()));
                  double a = random.nextDouble() * Math.PI * 2.0;
                  double dist = mood == 2 ? random.nextDouble() * 140.0 : 40.0 + random.nextDouble() * 110.0;
                  double cx = p.getX() + Math.cos(a) * dist;
                  double cz = p.getZ() + Math.sin(a) * dist;
                  double cy = Math.min(290.0, p.getY() + (mood == 2 ? 36.0 : 46.0) + random.nextDouble() * 18.0);
                  double radius = mood == 2 ? 38.0 + random.nextDouble() * 26.0 : 16.0 + random.nextDouble() * 22.0;
                  int puffs = Mth.clamp((int) (radius * 0.9), 10, 60);
                  if (puffTotal + puffs > MESH_MAX) {
                      return;
                  }
                  int id = ++counter;
                  int life = (120 + random.nextInt(120)) * 20;
                  cells.add(new Cell(id, puffs, mood, life, cx, cz));
                  puffTotal += puffs;

                  String brightness = mood == 2 ? "{sky:8,block:0}" : (mood == 1 ? "{sky:12,block:0}" : "{sky:15,block:15}");
                  for (int k = 0; k < puffs; k++) {
                      double ang = random.nextDouble() * Math.PI * 2.0;
                      double r = Math.sqrt(random.nextDouble()) * radius;
                      double edge = r / radius;
                      double height = (1.0 - edge * edge) * radius * 0.28 * random.nextDouble();
                      double size = (6.0 + random.nextDouble() * 7.0) * (1.0 - 0.45 * edge);
                      double sx = size;
                      double sy = size * (mood == 2 ? 0.55 : 0.8);
                      double sz = size;

                      // random rotation (quaternion) so the cubes do not look like a grid
                      double ax = random.nextDouble() - 0.5;
                      double ay = random.nextDouble() - 0.5;
                      double az = random.nextDouble() - 0.5;
                      double al = Math.max(1.0E-6, Math.sqrt(ax * ax + ay * ay + az * az));
                      ax /= al;
                      ay /= al;
                      az /= al;
                      double theta = random.nextDouble() * Math.PI;
                      double s = Math.sin(theta / 2.0);
                      double qx = ax * s;
                      double qy = ay * s;
                      double qz = az * s;
                      double qw = Math.cos(theta / 2.0);

                      // translation = -(rotation applied to half of the scaled cube), so the cube turns around its middle
                      double vx = sx / 2.0;
                      double vy = sy / 2.0;
                      double vz = sz / 2.0;
                      double tx = 2.0 * (qy * vz - qz * vy);
                      double ty = 2.0 * (qz * vx - qx * vz);
                      double tz = 2.0 * (qx * vy - qy * vx);
                      double rx = vx + qw * tx + (qy * tz - qz * ty);
                      double ry = vy + qw * ty + (qz * tx - qx * tz);
                      double rz = vz + qw * tz + (qx * ty - qy * tx);

                      String nbt = "{Tags:[\"palcloud\",\"palcloud" + id + "\",\"palsess" + session + "\"],"
                              + "block_state:{Name:\"" + blockFor(mood) + "\"},"
                              + "transformation:{left_rotation:[" + f(qx) + "," + f(qy) + "," + f(qz) + "," + f(qw) + "],"
                              + "right_rotation:[0f,0f,0f,1f],scale:[" + f(sx) + "," + f(sy) + "," + f(sz) + "],"
                              + "translation:[" + f(-rx) + "," + f(-ry) + "," + f(-rz) + "]},"
                              + "brightness:" + brightness + ",view_range:3f,teleport_duration:40}";
                      commands.add(String.format(Locale.ROOT, "summon minecraft:block_display %.2f %.2f %.2f ",
                              cx + Math.cos(ang) * r, cy + height, cz + Math.sin(ang) * r) + nbt);
                  }
              }
          }
